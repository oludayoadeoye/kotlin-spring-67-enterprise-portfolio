server:
  port: 8118
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:realtimestockdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring Cloud Stream
  cloud:
    stream:
      bindings:
        quoteStreamProducer-out-0:
          destination: stock-quotes
      kafka:
        binder:
          brokers: localhost:9092

springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/portfolio-realm