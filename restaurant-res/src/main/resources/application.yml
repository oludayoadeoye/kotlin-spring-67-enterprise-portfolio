server:
  port: 8110
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:restaurantresdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html