spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:assistantdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/portfolio-realm
  # Spring AI Configuration
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-1.5-flash

  # Spring Cloud Stream
  cloud:
    stream:
      bindings:
        aiTaskConsumer-in-0:
          destination: ai-tasks
          group: ai-assistant-group
      rabbit:
        bindings:
          aiTaskConsumer-in-0:
            consumer:
              auto-bind-dlq: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
